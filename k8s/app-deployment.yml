apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-orchestrator-api
  labels:
    app: job-orchestrator-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: job-orchestrator-api
  template:
    metadata:
      labels:
        app: job-orchestrator-api
    spec:
      containers:
        - name: job-orchestrator-api
          image: job-orchestrator-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: job-orchestrator-api-config
            - secretRef:
                name: job-orchestrator-api-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5