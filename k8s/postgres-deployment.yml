apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-orchestrator-postgres
  labels:
    app: job-orchestrator-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: job-orchestrator-postgres
  template:
    metadata:
      labels:
        app: job-orchestrator-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: job-orchestrator-postgres-secret
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20