spring:
  application:
    name: job-orchestrator-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/job_orchestrator_db}
    username: ${SPRING_DATASOURCE_USERNAME:job_user}
    password: ${SPRING_DATASOURCE_PASSWORD:job_password}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

job-worker:
  enabled: true #Turns the worker on.
  batch-size: 5 #Worker processes up to 5 jobs per cycle.
  fixed-delay-ms: 10000 #Worker runs every 10 seconds.
  retry-delay-seconds: 15 #Failed retryable jobs wait 15 seconds before being picked again.
  worker-id: ${JOB_WORKER_ID:local-worker-1} #Identifies which worker claimed the job.
  stale-timeout-seconds: 60 #If a job stays PROCESSING for more than 60 seconds, treat it as stale.
  recovery-fixed-delay-ms: 30000 #Run stale job recovery every 30 seconds.


logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] correlationId=%X{correlationId:-N/A} jobId=%X{jobId:-N/A} workerId=%X{workerId:-N/A} %logger{36} - %msg%n"
  level:
    com.jdevs.joborchestrator: INFO


server:
  port: 8080
