spring:
  application:
    name: job-orchestrator-api

  datasource:
    url: jdbc:postgresql://localhost:5434/job_orchestrator_db
    username: job_user
    password: job_password

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

job-worker:
  enabled: true
  batch-size: 5
  fixed-delay-ms: 10000
  max-attempts: 3


server:
  port: 8080
