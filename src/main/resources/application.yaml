spring:
  application:
    name: job-orchestrator-api

  datasource:
    url: jdbc:postgresql://localhost:5434/job_orchestrator_db
    username: job_user
    password: job_password

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

job-worker:
  enabled: true #Turns the worker on.
  batch-size: 5 #Worker processes up to 5 jobs per cycle.
  fixed-delay-ms: 10000 #Worker runs every 10 seconds.
  retry-delay-seconds: 15 #Failed retryable jobs wait 15 seconds before being picked again.
  worker-id: local-worker-1 #Identifies which worker claimed the job.


server:
  port: 8080
